<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たてよこ算 (2×2)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
            background: #f0f4f8;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 8px; font-size: 28px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 20px; font-size: 14px; }
        .instructions {
            max-width: 600px; margin: 0 auto 20px; background: #e8f4fd;
            padding: 12px 16px; border-radius: 8px; border-left: 4px solid #3498db;
            font-size: 14px; line-height: 1.6;
        }
        .nav { text-align: center; margin-bottom: 20px; }
        .nav button {
            background: #3498db; color: white; border: none; padding: 8px 20px;
            margin: 0 5px; border-radius: 6px; font-size: 15px; cursor: pointer;
        }
        .nav button:hover { background: #2980b9; }
        .nav button:disabled { background: #bdc3c7; cursor: default; }
        .nav .problem-counter {
            display: inline-block; margin: 0 15px; font-size: 16px;
            font-weight: bold; color: #2c3e50; vertical-align: middle;
        }
        .game-area { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .grid-container {
            display: inline-block; background: white; padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        table { border-collapse: collapse; }
        td {
            width: 64px; height: 64px; text-align: center; vertical-align: middle;
            font-size: 22px; font-weight: bold; border: 2px solid #ddd;
        }
        td.operator { background: #3498db; color: white; font-size: 26px; border-color: #3498db; }
        td.target-col, td.target-row { background: #eaf2f8; color: #2c3e50; border-color: #bdd5ea; }
        td.cell { background: white; cursor: pointer; transition: all 0.15s; }
        td.cell:hover { background: #ebf5fb; border-color: #3498db; }
        td.cell.selected { background: #d4effd; border-color: #3498db; box-shadow: inset 0 0 0 2px #3498db; }
        td.black-cell { background: #2c3e50; border-color: #2c3e50; cursor: default; }
        .number-pad { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 350px; }
        .number-pad button {
            width: 50px; height: 50px; font-size: 20px; font-weight: bold;
            border: 2px solid #ddd; border-radius: 10px; background: white; cursor: pointer;
        }
        .number-pad button:hover { background: #3498db; color: white; border-color: #3498db; }
        .number-pad button.clear-btn { width: 70px; background: #e74c3c; color: white; border-color: #e74c3c; }
        .number-pad button.clear-btn:hover { background: #c0392b; }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .controls button { padding: 10px 24px; font-size: 15px; border: none; border-radius: 6px; cursor: pointer; color: white; }
        .btn-reset { background: #e74c3c; }
        .btn-reset:hover { background: #c0392b; }
        .btn-hint { background: #f39c12; }
        .btn-hint:hover { background: #e67e22; }
        .btn-answer { background: #8e44ad; }
        .btn-answer:hover { background: #7d3c98; }
        .feedback { text-align: center; font-size: 18px; font-weight: bold; min-height: 30px; margin-top: 10px; }
        .feedback.success { color: #27ae60; }
        .feedback.hint { color: #f39c12; }
        .success-banner {
            display: none; text-align: center; font-size: 36px; font-weight: bold;
            color: #27ae60; padding: 16px; margin-bottom: 10px;
            animation: popIn 0.5s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>たてよこ算 (2×2)</h1>
    <div class="subtitle" id="problem-type"></div>
    <div class="instructions">
        <strong>＜ルール＞</strong><br>
        タテにかけると上の数字に、ヨコにかけると左の数字になるように、数字を入れましょう。
    </div>
    <div class="nav">
        <button id="prev-btn" onclick="prevProblem()">◀ 前へ</button>
        <span class="problem-counter" id="counter">1 / 1</span>
        <button id="next-btn" onclick="nextProblem()">次へ ▶</button>
    </div>
    <div class="game-area">
        <div class="success-banner" id="success-banner">🎉 せいかいです！おめでとう！</div>
        <div class="grid-container"><table id="grid-table"></table></div>
        <div class="number-pad" id="number-pad"></div>
        <div class="controls">
            <button class="btn-reset" onclick="resetProblem()">リセット</button>
            <button class="btn-hint" onclick="showHint()">ヒント</button>
            <button class="btn-answer" onclick="showAnswer()">こたえ</button>
        </div>
        <div class="feedback" id="feedback"></div>
    </div>
    <script>
    const problems = [{"type": "multiplication", "size": 2, "grid": [[1, 2], [4, 8]], "row_targets": [2, 32], "col_targets": [4, 16], "black_cells": []}, {"type": "multiplication", "size": 2, "grid": [[2, 7], [8, 9]], "row_targets": [14, 72], "col_targets": [16, 63], "black_cells": []}, {"type": "multiplication", "size": 2, "grid": [[3, 4], [8, 9]], "row_targets": [12, 72], "col_targets": [24, 36], "black_cells": []}, {"type": "multiplication", "size": 2, "grid": [[2, 4], [6, 8]], "row_targets": [8, 48], "col_targets": [12, 32], "black_cells": []}, {"type": "multiplication", "size": 2, "grid": [[1, 5], [7, 8]], "row_targets": [5, 56], "col_targets": [7, 40], "black_cells": []}, {"type": "multiplication", "size": 2, "grid": [[1, 2], [6, 8]], "row_targets": [2, 48], "col_targets": [6, 16], "black_cells": []}, {"type": "multiplication", "size": 2, "grid": [[2, 3], [5, 7]], "row_targets": [6, 35], "col_targets": [10, 21], "black_cells": []}, {"type": "multiplication", "size": 2, "grid": [[3, 5], [6, 7]], "row_targets": [15, 42], "col_targets": [18, 35], "black_cells": []}, {"type": "multiplication", "size": 2, "grid": [[3, 5], [6, 8]], "row_targets": [15, 48], "col_targets": [18, 40], "black_cells": []}, {"type": "multiplication", "size": 2, "grid": [[6, 7], [8, 9]], "row_targets": [42, 72], "col_targets": [48, 63], "black_cells": []}];
    let currentIndex = 0;
    let selectedCell = null;
    let userAnswers = {};

    function init() { buildNumberPad(); loadProblem(0); }

    function buildNumberPad() {
        const pad = document.getElementById('number-pad');
        pad.innerHTML = '';
        for (let n = 1; n <= 9; n++) {
            const btn = document.createElement('button');
            btn.textContent = n;
            btn.onclick = () => inputNumber(n);
            pad.appendChild(btn);
        }
        const clearBtn = document.createElement('button');
        clearBtn.textContent = '消す';
        clearBtn.className = 'clear-btn';
        clearBtn.onclick = () => inputNumber(0);
        pad.appendChild(clearBtn);
    }

    function loadProblem(index) {
        currentIndex = index;
        selectedCell = null;
        const p = problems[index];
        const size = p.size;
        const op = p.type === 'addition' ? '+' : '×';
        const blackCells = (p.black_cells || []).map(bc => bc[0] + ',' + bc[1]);
        if (!userAnswers[index]) userAnswers[index] = {};

        document.getElementById('counter').textContent = (index + 1) + ' / ' + problems.length;
        document.getElementById('prev-btn').disabled = index === 0;
        document.getElementById('next-btn').disabled = index === problems.length - 1;
        const typeLabel = p.type === 'addition' ? 'たし算' : 'かけ算';
        document.getElementById('problem-type').textContent = '第' + (index + 1) + '問 (' + size + '×' + size + ' ' + typeLabel + ')';

        const table = document.getElementById('grid-table');
        table.innerHTML = '';
        const headerRow = document.createElement('tr');
        const opCell = document.createElement('td');
        opCell.className = 'operator'; opCell.textContent = op;
        headerRow.appendChild(opCell);
        for (let j = 0; j < size; j++) {
            const td = document.createElement('td');
            td.className = 'target-col'; td.textContent = p.col_targets[j];
            headerRow.appendChild(td);
        }
        table.appendChild(headerRow);

        for (let i = 0; i < size; i++) {
            const tr = document.createElement('tr');
            const rowTarget = document.createElement('td');
            rowTarget.className = 'target-row'; rowTarget.textContent = p.row_targets[i];
            tr.appendChild(rowTarget);
            for (let j = 0; j < size; j++) {
                const td = document.createElement('td');
                const key = i + ',' + j;
                if (blackCells.includes(key)) { td.className = 'black-cell'; }
                else {
                    td.className = 'cell'; td.dataset.row = i; td.dataset.col = j;
                    td.onclick = function() { selectCell(this); };
                    if (userAnswers[index][key]) td.textContent = userAnswers[index][key];
                }
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('success-banner').style.display = 'none';
        updatePad();
    }

    function updatePad() {
        const used = new Set();
        document.querySelectorAll('td.cell').forEach(c => {
            const v = c.textContent.trim();
            if (v) used.add(parseInt(v));
        });
        const btns = document.querySelectorAll('#number-pad button:not(.clear-btn)');
        btns.forEach(btn => {
            const n = parseInt(btn.textContent);
            btn.disabled = used.has(n);
            btn.style.opacity = used.has(n) ? '0.3' : '1';
        });
    }

    function selectCell(td) {
        if (selectedCell) selectedCell.classList.remove('selected');
        selectedCell = td; td.classList.add('selected');
    }

    function inputNumber(n) {
        if (!selectedCell) return;
        const key = selectedCell.dataset.row + ',' + selectedCell.dataset.col;
        if (n === 0) { selectedCell.textContent = ''; delete userAnswers[currentIndex][key]; }
        else { selectedCell.textContent = n; userAnswers[currentIndex][key] = n; }
        updatePad();
        checkComplete();
    }

    function checkComplete() {
        const p = problems[currentIndex];
        const size = p.size;
        const isAdd = p.type === 'addition';
        const blackCells = (p.black_cells || []).map(bc => bc[0] + ',' + bc[1]);
        const userGrid = Array.from({length: size}, () => Array(size).fill(null));
        document.querySelectorAll('td.cell').forEach(c => {
            const v = c.textContent.trim();
            userGrid[parseInt(c.dataset.row)][parseInt(c.dataset.col)] = v ? parseInt(v) : null;
        });
        for (let i = 0; i < size; i++)
            for (let j = 0; j < size; j++)
                if (!blackCells.includes(i+','+j) && userGrid[i][j] === null) return;
        for (let i = 0; i < size; i++) {
            let val = isAdd ? 0 : 1;
            for (let j = 0; j < size; j++) {
                if (blackCells.includes(i+','+j)) continue;
                if (isAdd) val += userGrid[i][j]; else val *= userGrid[i][j];
            }
            if (val !== p.row_targets[i]) return;
        }
        for (let j = 0; j < size; j++) {
            let val = isAdd ? 0 : 1;
            for (let i = 0; i < size; i++) {
                if (blackCells.includes(i+','+j)) continue;
                if (isAdd) val += userGrid[i][j]; else val *= userGrid[i][j];
            }
            if (val !== p.col_targets[j]) return;
        }
        document.getElementById('success-banner').style.display = 'block';
        setTimeout(() => { if (currentIndex < problems.length - 1) loadProblem(currentIndex + 1); }, 1500);
    }

    function resetProblem() { userAnswers[currentIndex] = {}; loadProblem(currentIndex); }

    function showHint() {
        const p = problems[currentIndex];
        const emptyCells = [];
        document.querySelectorAll('td.cell').forEach(c => { if (!c.textContent) emptyCells.push(c); });
        if (emptyCells.length === 0) { showFeedback('すべてのマスが埋まっています。', 'hint'); return; }
        const hintCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        const r = parseInt(hintCell.dataset.row), col = parseInt(hintCell.dataset.col);
        hintCell.textContent = p.grid[r][col];
        userAnswers[currentIndex][r + ',' + col] = p.grid[r][col];
        showFeedback('ヒント：1つのマスを埋めました。', 'hint');
        updatePad();
        checkComplete();
    }

    function showAnswer() {
        const p = problems[currentIndex];
        document.querySelectorAll('td.cell').forEach(c => {
            const r = parseInt(c.dataset.row), col = parseInt(c.dataset.col);
            c.textContent = p.grid[r][col];
            userAnswers[currentIndex][r + ',' + col] = p.grid[r][col];
        });
        showFeedback('こたえを表示しました。', 'hint');
    }

    function showFeedback(msg, type) {
        const fb = document.getElementById('feedback');
        fb.textContent = msg; fb.className = 'feedback ' + (type || '');
    }
    function prevProblem() { if (currentIndex > 0) loadProblem(currentIndex - 1); }
    function nextProblem() { if (currentIndex < problems.length - 1) loadProblem(currentIndex + 1); }

    document.addEventListener('keydown', function(e) {
        if (e.key >= '1' && e.key <= '9') inputNumber(parseInt(e.key));
        else if (e.key === 'Backspace' || e.key === 'Delete') inputNumber(0);
        else if (e.key === 'ArrowLeft') prevProblem();
        else if (e.key === 'ArrowRight') nextProblem();
    });
    init();
    </script>
</body>
</html>
