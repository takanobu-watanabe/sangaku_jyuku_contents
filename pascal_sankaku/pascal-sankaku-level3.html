<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスカルの三角形 Level 3 道のり</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Rounded Mplus 1c', 'Hiragino Maru Gothic Pro', 'Yu Gothic', sans-serif;
    background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
    min-height: 100vh; color: #333; user-select: none;
    display: flex; flex-direction: column; align-items: center;
  }
  #header { width: 100%; padding: 10px 20px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(0,0,0,0.1); z-index: 10; }
  #header h1 { font-size: 1.15rem; color: #2c3e50; }
  #level-badge { background: #e74c3c; color: white; padding: 4px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }

  #selfcheck { width: 100%; text-align: center; font-size: 0.8rem; padding: 5px 12px; font-weight: bold; cursor: pointer; display: none; }
  #selfcheck.ng { background: #fadbd8; color: #c0392b; display: block; }
  #selfcheck-detail { display: none; width: 100%; max-width: 600px; background: rgba(255,255,255,0.95); color: #c0392b; font-size: 0.78rem; text-align: left; padding: 8px 16px; white-space: pre-wrap; border-radius: 0 0 10px 10px; }

  #main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 14px; width: 100%; max-width: 680px; }
  @media (min-width: 601px) { body { padding-right: 250px; } }
  @media (max-width: 600px) { body { padding-right: 0; } }

  #puzzle-title { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 16px; padding: 10px 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15); font-size: 1.05rem; font-weight: bold; color: #2c3e50; }
  #rule-display { background: rgba(255,255,255,0.88); backdrop-filter: blur(10px); border-radius: 12px; padding: 10px 18px; text-align: center; font-size: 0.9rem; color: #444; box-shadow: 0 2px 8px rgba(0,0,0,0.08); line-height: 1.5; max-width: 520px; }
  #progress-bar { width: 100%; max-width: 420px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; }
  #progress-fill { height: 100%; background: linear-gradient(90deg, #00b894, #55efc4); border-radius: 4px; transition: width 0.5s ease; }

  #nav { display: flex; align-items: center; gap: 14px; justify-content: center; }
  .nav-btn { padding: 8px 18px; border: none; border-radius: 20px; background: rgba(255,255,255,0.92); font-size: 0.9rem; font-weight: bold; color: #2c3e50; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .nav-btn:disabled { opacity: 0.35; }
  #nav-count { font-weight: bold; color: #fff; font-size: 0.95rem; min-width: 60px; text-align: center; }

  /* 格子 */
  #grid-wrap { background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); border-radius: 16px; padding: 30px 26px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); overflow-x: auto; }
  #grid { display: grid; }
  .node {
    position: relative; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-weight: bold; z-index: 2;
    background: #fff; border: 2px solid #b2bec3; color: #2c3e50;
  }
  .node .road-r, .node .road-d { position: absolute; background: #b2bec3; z-index: 1; }
  .node .road-r { right: 0; top: 50%; height: 4px; transform: translateY(-50%); }
  .node .road-d { bottom: 0; left: 50%; width: 4px; transform: translateX(-50%); }
  .node.start { background: linear-gradient(135deg,#55efc4,#00b894); color:#fff; border-color:#00b894; }
  .node.goal  { box-shadow: 0 0 0 4px rgba(231,76,60,0.5); }
  .node.blocked { background: #636e72; border-color:#2d3436; color:#fff; }
  .node.blank { background: linear-gradient(135deg,#ffeaa7,#fdcb6e); border-color:#f39c12; cursor:pointer; color:#b9770e; }
  .node.blank.active { background: linear-gradient(135deg,#81ecec,#00cec9); border-color:#00b894; color:#fff; transform: scale(1.1); }
  .node.blank.right { background: linear-gradient(135deg,#55efc4,#00b894); color:#fff; border-color:#00b894; }
  .node.blank.wrong { background: linear-gradient(135deg,#ff7675,#d63031); color:#fff; border-color:#d63031; animation: shake 0.4s; }
  .tag { position: absolute; font-size: 0.62rem; font-weight: bold; color: #2c3e50; white-space: nowrap; }
  .tag.s { top: -18px; left: 50%; transform: translateX(-50%); color:#00b894; }
  .tag.g { bottom: -18px; left: 50%; transform: translateX(-50%); color:#e74c3c; }

  #pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); border-radius: 16px; padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); position: fixed; right: 12px; top: 50%; transform: translateY(-50%); width: 230px; z-index: 50; }
  @media (max-width: 600px) { #pad { position: static; transform: none; width: 100%; max-width: 360px; } }
  .pad-key { padding: 12px 0; border: none; border-radius: 10px; background: linear-gradient(135deg,#74b9ff,#0984e3); color:#fff; font-size:1.3rem; font-weight:bold; cursor:pointer; }
  .pad-key.fn { background: linear-gradient(135deg,#b2bec3,#636e72); }

  #controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .ctrl-btn { padding: 10px 16px; border: none; border-radius: 12px; background: rgba(255,255,255,0.92); font-size: 0.88rem; cursor: pointer; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .ctrl-btn.primary { background: #3498db; color: #fff; }

  #instructions { background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); border-radius: 12px; padding: 8px 18px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 480px; }
  #instructions .msg { font-size: 0.88rem; color: #333; }
  #answer-line { font-size: 0.95rem; font-weight: bold; color:#2c3e50; }
  #answer-line b { color:#e74c3c; font-size:1.2rem; }

  #score-panel { position: fixed; top: 56px; right: 14px; background: rgba(255,255,255,0.9); border-radius: 14px; padding: 8px 14px; z-index: 10; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  #score-panel .label { font-size: 0.7rem; color: #888; }
  #score-panel .value { font-size: 1.3rem; font-weight: bold; color: #2c3e50; }

  #feedback { position: fixed; top: 45%; left: 50%; transform: translate(-50%,-50%); font-size: 2.4rem; font-weight: bold; z-index: 100; pointer-events: none; opacity: 0; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  #feedback.show { opacity: 1; animation: pop 0.9s ease forwards; }

  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0.5); opacity:0; } 40% { transform: translate(-50%,-50%) scale(1.3); opacity:1; } 70% { transform: translate(-50%,-50%) scale(1); opacity:1; } 100% { transform: translate(-50%,-50%) scale(1); opacity:0; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
</style>
</head>
<body>

<div id="header">
  <h1>🗺️ パスカルの三角形 Lv3 道のり</h1>
  <span id="level-badge">Q1</span>
</div>
<div id="selfcheck" onclick="toggleCheckDetail()"></div>
<div id="selfcheck-detail"></div>

<div id="main">
  <div id="puzzle-title">—</div>
  <div id="rule-display">—</div>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  <div id="nav">
    <button class="nav-btn" id="prev-btn" onclick="prevPuzzle()">◀ まえ</button>
    <span id="nav-count">1 / 5</span>
    <button class="nav-btn" id="next-btn" onclick="goNext()">つぎ ▶</button>
  </div>

  <div id="grid-wrap"><div id="grid"></div></div>
  <div id="pad"></div>

  <div id="controls">
    <button class="ctrl-btn" onclick="resetPuzzle()">🔄 やりなおし</button>
    <button class="ctrl-btn primary" onclick="judge()">⭕ はんてい</button>
    <button class="ctrl-btn" onclick="showHint()">💡 ヒント</button>
    <button class="ctrl-btn" onclick="showAnswer()">👀 こたえ</button>
  </div>

  <div id="instructions">
    <div class="msg" id="msg-text">—</div>
    <div id="answer-line"></div>
  </div>
</div>

<div id="score-panel"><div class="label">スコア</div><div class="value" id="score">0</div></div>
<div id="feedback"></div>

<script>
// ==========================================================
// パスカルの三角形 Level 4: 道のりの組み合わせ数（格子の最短経路）
//
// スタート(左上)からゴール(右下)まで、右と下だけに進む最短経路の数は、
// 各交差点に「左＋上」を書き込むとパスカルの三角形（二項係数）になる。
// ゴールの経路数 = C(cols+rows, cols)。
//
//   各問題: { id, difficulty, title, cols, rows, blocked:[{x,y}], hint }
//     cols×rows = 街区の数。交差点は (cols+1)×(rows+1)。
//     blocked   = 通れない交差点（工事中）。そこは経路数 0。
//     端（上辺・左辺）の交差点は表示（一本道なので 1）。内側の交差点を埋める。
// ==========================================================

const PUZZLES = [
  { id:"Q1", difficulty:3, title:"3×3の街、ゴールまで何通り？", cols:3, rows:3, blocked:[],
    hint:"各交差点に「左のマス＋上のマス」の数を書こう。それがそこまでの道のりの数。上辺と左辺は一本道で 1 だよ。" },
  { id:"Q2", difficulty:3, title:"横長の街（4×2）", cols:4, rows:2, blocked:[],
    hint:"横に長い街。やり方は同じ、各交差点に「左＋上」をたそう。" },
  { id:"Q3", difficulty:4, title:"工事中の交差点（どのルート？）", cols:3, rows:3, blocked:[{x:2,y:1}],
    hint:"灰色の×は工事中で通れないので 0。あとは左＋上をたそう。工事のせいでゴールまでの通り数がへるよ。" },
  { id:"Q4", difficulty:4, title:"4×4の街、工事2か所", cols:4, rows:4, blocked:[{x:1,y:2},{x:3,y:1}],
    hint:"工事中の×が2か所。そこは 0 として、左＋上をたそう。" },
  { id:"Q5", difficulty:5, title:"4×4＋工事3か所（むずかしい）", cols:4, rows:4, blocked:[{x:1,y:2},{x:3,y:1},{x:2,y:3}],
    hint:"工事中の×が3か所。×は 0。左＋上をていねいにたして、ゴールまで何通りか求めよう。" },
];

// ==========================================================
// 経路数（左＋上）。blocked は 0。
// ==========================================================
function buildPaths(cols, rows, blockedSet) {
  const w = cols+1, h = rows+1;
  const p = Array.from({length:h}, () => new Array(w).fill(0));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (blockedSet.has(x+","+y)) { p[y][x] = 0; continue; }
    if (x === 0 && y === 0) { p[y][x] = 1; continue; }
    let v = 0; if (x > 0) v += p[y][x-1]; if (y > 0) v += p[y-1][x];
    p[y][x] = v;
  }
  return p;
}
function blockedSetOf(p) { return new Set((p.blocked||[]).map(b => b.x+","+b.y)); }

// 埋めるマス（内側の交差点。スタートと端は表示。blocked は除く）
function getBlanks(p) {
  const blocked = blockedSetOf(p), list = [];
  for (let y = 1; y <= p.rows; y++) for (let x = 1; x <= p.cols; x++)
    if (!blocked.has(x+","+y)) list.push({x, y});
  return list;
}
function goalPaths(p) { return buildPaths(p.cols, p.rows, blockedSetOf(p))[p.rows][p.cols]; }

// ==========================================================
// セルフチェック
// ==========================================================
function validatePuzzles() {
  const errors = [], warnings = [], sigs = new Map();
  PUZZLES.forEach((p, idx) => {
    const tag = `[${idx+1}] ${p.id||"?"}`;
    if (!p.title) warnings.push(`${tag}: title なし`);
    if (!p.hint) warnings.push(`${tag}: hint なし`);
    if (!(p.cols >= 1 && p.rows >= 1)) errors.push(`${tag}: cols/rows が不正`);
    (p.blocked||[]).forEach(b => { if (b.x < 0 || b.x > p.cols || b.y < 0 || b.y > p.rows) errors.push(`${tag}: blocked {x:${b.x},y:${b.y}} が外`); });
    if ((p.blocked||[]).some(b => b.x===0 && b.y===0)) errors.push(`${tag}: スタートは blocked にできません`);
    if ((p.blocked||[]).some(b => b.x===p.cols && b.y===p.rows)) errors.push(`${tag}: ゴールは blocked にできません`);
    if (goalPaths(p) === 0) errors.push(`${tag}: ゴールまで行けません（経路数0）`);
    if (getBlanks(p).length === 0) errors.push(`${tag}: 埋めるマスがありません`);
    const sig = p.cols+"x"+p.rows+"|"+JSON.stringify((p.blocked||[]).map(b=>[b.x,b.y]).sort());
    if (sigs.has(sig)) warnings.push(`${tag}: ${sigs.get(sig)} と同じ`); else sigs.set(sig, p.id);
  });
  return { errors, warnings, total: PUZZLES.length };
}
function renderSelfCheck() {
  const res = validatePuzzles();
  const banner = document.getElementById("selfcheck"), detail = document.getElementById("selfcheck-detail");
  const lines = [];
  if (res.errors.length) lines.push("■ エラー", ...res.errors);
  if (res.warnings.length) lines.push("", "■ 注意", ...res.warnings);
  detail.textContent = lines.join("\n");
  if (res.errors.length === 0) { banner.className = ""; banner.textContent = ""; }
  else { banner.className = "ng"; banner.textContent = `⚠ ${res.errors.length}件の問題があります（タップで表示）`; }
  if (res.errors.length || res.warnings.length) console.warn(detail.textContent);
}
function toggleCheckDetail() { const d = document.getElementById("selfcheck-detail"); d.style.display = d.style.display === "block" ? "none" : "block"; }

// ==========================================================
// 状態
// ==========================================================
let curIdx = 0, score = 0, solved = false, gameDone = false;
let fillInputs = {}, activeBlank = null, pathData = [];

// ==========================================================
// 描画
// ==========================================================
function nodeSize(p) {
  const cols = p.cols + 1;
  const maxW = Math.min(window.innerWidth - 80, 520);
  const gap = 46;
  let s = Math.floor((maxW - gap*(cols-1)) / cols);
  return { cell: Math.max(34, Math.min(s, 64)), gap };
}
function renderGrid() {
  const p = PUZZLES[curIdx];
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const blocked = blockedSetOf(p);
  pathData = buildPaths(p.cols, p.rows, blocked);
  const blankSet = new Set(getBlanks(p).map(b => b.x+","+b.y));
  const { cell, gap } = nodeSize(p);
  grid.style.gridTemplateColumns = `repeat(${p.cols+1}, ${cell}px)`;
  grid.style.gridTemplateRows = `repeat(${p.rows+1}, ${cell}px)`;
  grid.style.columnGap = gap + "px";
  grid.style.rowGap = gap + "px";

  for (let y = 0; y <= p.rows; y++) for (let x = 0; x <= p.cols; x++) {
    const key = x+","+y;
    const node = document.createElement("div");
    node.className = "node";
    node.style.width = cell + "px"; node.style.height = cell + "px";
    node.style.fontSize = (cell*0.4) + "px";
    node.dataset.key = key;
    // 道（右・下）
    if (x < p.cols) { const r = document.createElement("span"); r.className = "road-r"; r.style.width = gap + "px"; node.appendChild(r); }
    if (y < p.rows) { const d = document.createElement("span"); d.className = "road-d"; d.style.height = gap + "px"; node.appendChild(d); }
    // 種類
    if (blocked.has(key)) { node.classList.add("blocked"); node.appendChild(txt("✕")); }
    else if (x === 0 && y === 0) { node.classList.add("start"); node.appendChild(txt("1")); node.appendChild(tag("スタート","s")); }
    else if (blankSet.has(key)) {
      node.classList.add("blank");
      if (x === p.cols && y === p.rows) { node.classList.add("goal"); node.appendChild(tag("ゴール","g")); }
      node.appendChild(txt(fillInputs[key] || ""));
      if (activeBlank === key) node.classList.add("active");
      node.onclick = () => selectBlank(key);
    } else { node.appendChild(txt(String(pathData[y][x]))); }   // 端（表示）
    grid.appendChild(node);
  }
  // こたえ欄
  const al = document.getElementById("answer-line");
  al.innerHTML = solved ? `ゴールまで <b>${goalPaths(p)}</b> 通り！` : "";
}
function txt(s){ const e=document.createElement("span"); e.textContent=s; e.style.zIndex=3; e.style.position="relative"; return e; }
function tag(s,c){ const e=document.createElement("span"); e.className="tag "+c; e.textContent=s; return e; }

// ==========================================================
// 入力パッド
// ==========================================================
function renderPad() {
  const pad = document.getElementById("pad"); pad.innerHTML = "";
  ["1","2","3","4","5","6","7","8","9","0"].forEach(k => { const b=document.createElement("button"); b.className="pad-key"; b.textContent=k; b.onclick=()=>padPress(k); pad.appendChild(b); });
  const del=document.createElement("button"); del.className="pad-key fn"; del.textContent="⌫"; del.style.gridColumn="span 2"; del.onclick=()=>padPress("del"); pad.appendChild(del);
  const clr=document.createElement("button"); clr.className="pad-key fn"; clr.textContent="クリア"; clr.style.gridColumn="span 3"; clr.style.fontSize="1rem"; clr.onclick=()=>padPress("clear"); pad.appendChild(clr);
}
function padPress(k) {
  if (solved) return;
  if (!activeBlank) { setMsg("先に黄色の交差点をえらんでね"); return; }
  let cur = fillInputs[activeBlank] || "";
  if (k === "del") cur = cur.slice(0,-1); else if (k === "clear") cur = ""; else if (cur.length < 4) cur += k;
  fillInputs[activeBlank] = cur; renderGrid();
}
function selectBlank(key) { if (solved) return; activeBlank = key; renderGrid(); setMsg("数字パッドかキーボードで入力。左＋上の数だよ。"); }
function blankKeyList() { return getBlanks(PUZZLES[curIdx]).map(b => b.x+","+b.y); }
function selectFirstEmpty() { const ks=blankKeyList(); activeBlank = ks.find(k=>!fillInputs[k]) || ks[0] || null; renderGrid(); }
function selectNextBlank() { const ks=blankKeyList(); if(!ks.length)return; const i=ks.indexOf(activeBlank); activeBlank=ks[(i+1)%ks.length]; renderGrid(); }

// ==========================================================
// 判定
// ==========================================================
function judge() {
  if (solved) return;
  const p = PUZZLES[curIdx];
  let allRight = true, anyEmpty = false;
  document.querySelectorAll(".node.blank").forEach(n => n.classList.remove("right","wrong"));
  getBlanks(p).forEach(b => {
    const key = b.x+","+b.y, correct = pathData[b.y][b.x], val = parseInt(fillInputs[key], 10);
    const node = document.querySelector(`.node[data-key="${key}"]`);
    if (isNaN(val)) { anyEmpty = true; allRight = false; return; }
    if (val === correct) { if (node) node.classList.add("right"); }
    else { if (node) node.classList.add("wrong"); allRight = false; }
  });
  if (anyEmpty) { setMsg("まだ空いている交差点があるよ"); return; }
  if (allRight) onSolved(); else setMsg("赤い交差点をもう一度。左＋上をたそう。");
}
function onSolved() {
  solved = true; score += PUZZLES[curIdx].difficulty * 10;
  document.getElementById("score").textContent = score;
  showFeedback("⭕ せいかい！", "#27ae60");
  setMsg("ゴールまでの道のりが全部わかったね！");
  renderGrid();
  setTimeout(nextPuzzle, 2400);
}
function showFeedback(t,c){ const el=document.getElementById("feedback"); el.textContent=t; el.style.color=c; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show"); }

// ==========================================================
// 遷移
// ==========================================================
function setMsg(t){ document.getElementById("msg-text").textContent = t; }
function loadPuzzle(idx) {
  if (idx >= PUZZLES.length) { showComplete(); return; }
  curIdx = idx; solved = false; gameDone = false; fillInputs = {}; activeBlank = null;
  const p = PUZZLES[idx];
  document.getElementById("level-badge").textContent = `${p.id}  ${"★".repeat(p.difficulty)}`;
  document.getElementById("puzzle-title").textContent = p.title || "";
  document.getElementById("progress-fill").style.width = `${(idx/PUZZLES.length)*100}%`;
  document.getElementById("nav-count").textContent = `${idx+1} / ${PUZZLES.length}`;
  document.getElementById("prev-btn").disabled = (idx === 0);
  document.getElementById("next-btn").disabled = (idx >= PUZZLES.length - 1);
  document.getElementById("rule-display").innerHTML =
    "スタートからゴールまで <b>右と下だけ</b> に進むよ。<br>各交差点に「左＋上」の数を書こう＝そこまでの道のりの数！";
  document.getElementById("answer-line").innerHTML = "";
  setMsg("黄色の交差点をえらんで、数字を入力しよう");
  renderGrid();
}
function resetPuzzle() { if (solved) return; loadPuzzle(curIdx); }
function showHint() { if (solved) return; setMsg(PUZZLES[curIdx].hint || "左＋上をたそう！"); }
function showAnswer() {
  if (solved) return;
  const p = PUZZLES[curIdx];
  getBlanks(p).forEach(b => { fillInputs[b.x+","+b.y] = String(pathData[b.y][b.x]); });
  solved = true; renderGrid();
  document.querySelectorAll(".node.blank").forEach(n => n.classList.add("right"));
  setMsg("これが正解だよ！");
  setTimeout(nextPuzzle, 2600);
}
function nextPuzzle() { if (curIdx + 1 < PUZZLES.length) loadPuzzle(curIdx + 1); else showComplete(); }
function prevPuzzle() { if (curIdx > 0) loadPuzzle(curIdx - 1); }
function goNext() { if (curIdx + 1 < PUZZLES.length) loadPuzzle(curIdx + 1); }
function showComplete() {
  gameDone = true;
  document.getElementById("puzzle-title").textContent = "🎉 ぜんぶクリア！";
  document.getElementById("rule-display").innerHTML = `スコア <b>${score}</b> てん！パスカルの三角形は道のりの数も表せるんだね。`;
  document.getElementById("grid").innerHTML = '<div style="text-align:center;font-size:3rem;padding:30px;grid-column:1/-1">🏆</div>';
  document.getElementById("pad").style.display = "none";
  document.getElementById("answer-line").innerHTML = "";
  document.getElementById("progress-fill").style.width = "100%";
  document.getElementById("next-btn").disabled = true;
  setMsg("よくがんばりました！");
}

// ==========================================================
// 初期化
// ==========================================================
window.addEventListener("resize", () => { if (!gameDone) renderGrid(); });
document.addEventListener("keydown", (e) => {
  if (solved || gameDone) return;
  if (/^[0-9]$/.test(e.key)) { if (!activeBlank) selectFirstEmpty(); padPress(e.key); e.preventDefault(); }
  else if (e.key === "Backspace") { if (activeBlank) { padPress("del"); e.preventDefault(); } }
  else if (e.key === "Enter" || e.key === "Tab" || e.key === "ArrowRight" || e.key === "ArrowDown") { selectNextBlank(); e.preventDefault(); }
});
renderSelfCheck();
renderPad();
loadPuzzle(0);
</script>
</body>
</html>
